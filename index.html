
<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sufiyan AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: 25px auto;
    background: #1e293b;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 25px #0006;
}

header {
    background: #2563eb;
    text-align: center;
    padding: 18px;
}

header h2 { margin: 0; }
header p { margin-bottom: 0; }

#chat {
    height: 390px;
    overflow-y: auto;
    padding: 15px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    max-width: 85%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #334155;
    margin-right: auto;
}

.controls {
    display: flex;
    gap: 8px;
    padding: 10px;
}

input {
    min-width: 0;
    padding: 12px;
    border-radius: 8px;
    border: none;
}

#question { flex: 1; }

button {
    padding: 11px 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled { opacity: .5; }

.clear {
    background: #dc2626;
    margin: 0 10px 10px;
}

.settings {
    padding: 10px;
}

.settings input {
    width: 100%;
    margin-top: 7px;
}

.note {
    color: #cbd5e1;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h2>🤖 SUFIYAN AI</h2>
    <p>Ask Me Anything ❤️</p>
</header>

<div class="settings">
    <label>Gemini API Key:</label>
    <input id="apiKey" type="password"
           placeholder="Paste your API key here">
    <p class="note">API Key ഈ പേജിൽ മാത്രം ഉപയോഗിക്കുന്നു.
    മറ്റുള്ളവർക്ക് ഈ പേജ് നൽകുമ്പോൾ Key സുരക്ഷിതമല്ല.</p>
</div>

<div id="chat">
    <div class="message bot">
        ഹായ്! ഞാൻ Sufiyan AI ആണ് ❤️
        എന്തും ചോദിക്കാം!
    </div>
</div>

<div class="controls">
    <input id="question" placeholder="Ask anything..."
           onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<button class="clear" onclick="clearChat()">Clear Chat</button>

</div>

<script>

const chat = document.getElementById("chat");
const history = [];

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function isCreatorQuestion(q) {
    const patterns = [
        "who created you",
        "who made you",
        "who built you",
        "who is your creator",
        "ആരാണ് നിന്നെ ഉണ്ടാക്കിയത്",
        "നിന്നെ ഉണ്ടാക്കിയത് ആര്",
        "ആരാണ് നിന്നെ സൃഷ്ടിച്ചത്",
        "ninne undakiyath",
        "ninne undakkiyath",
        "aaran ninne undakiyath",
        "aran ninne undakiyath",
        "aara ninne undakiyath"
    ];

    return patterns.some(p => q.includes(p));
}

async function sendMessage() {

    const input = document.getElementById("question");
    const button = document.getElementById("sendBtn");

    const question = input.value.trim();
    const apiKey = document.getElementById("apiKey").value.trim();

    if (!question) return;

    addMessage(question, "user");
    input.value = "";

    // Special Sufiyan answer
    if (isCreatorQuestion(question.toLowerCase())) {

        const answer =
        "verum 16 vayyasulla 10th padikuna sufiyan aan enne undakiyath";

        addMessage(answer, "bot");

        history.push(
            { role: "user", parts: [{ text: question }] },
            { role: "model", parts: [{ text: answer }] }
        );

        return;
    }

    if (!apiKey) {
        addMessage("ആദ്യം Gemini API Key നൽകുക. ❤️", "bot");
        return;
    }

    button.disabled = true;
    button.textContent = "Thinking...";

    try {

        history.push({
            role: "user",
            parts: [{ text: question }]
        });

        const response = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
          {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
            },
            body: JSON.stringify({
                system_instruction: {
                    parts: [{
                        text: `You are Sufiyan AI, a friendly and helpful chatbot.
Answer questions on all topics as accurately as possible.
Prefer Malayalam when the user speaks Malayalam or Manglish.
You can also answer in English.
Be honest if you do not know something.
If asked who created you, say exactly:
verum 16 vayyasulla 10th padikuna sufiyan aan enne undakiyath`
                    }]
                },
                contents: history,
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 1000
                }
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const answer =
          data.candidates?.[0]?.content?.parts
          ?.map(part => part.text || "")
          .join("") || "ഉത്തരം ലഭിച്ചില്ല.";

        addMessage(answer, "bot");

        history.push({
            role: "model",
            parts: [{ text: answer }]
        });

    } catch (error) {

        history.pop();

        addMessage(
            "Error: " + error.message +
            "\nAPI Key പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.",
            "bot"
        );

    } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
    }
}

function clearChat() {
    chat.innerHTML = "";
    history.length = 0;
    addMessage("Chat cleared! എന്താണ് പുതിയ ചോദ്യം?", "bot");
}

</script>

</body>
</html>
